spring.application.name=spring-boot-learning

logging.level.org.springframework.web=INFO
logging.level.com.rick.webservice=DEBUG

# In-memory H2 so the app starts without a local Postgres install.
spring.datasource.url=jdbc:h2:mem:learningdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
